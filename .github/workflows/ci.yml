name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: Browser tests (${{ matrix.artifact }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        artifact: [source, minified]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Fetch pinned fonts for the font cache test
        run: |
          mkdir -p .fonts && cd .fonts
          npm pack @fontsource-variable/inter@5.3.0 @fontsource-variable/jetbrains-mono@5.3.0 --silent
          for archive in *.tgz; do tar -xzf "$archive" --wildcards 'package/files/*-latin-wght-normal.woff2'; done
          ls -la package/files

      - name: Check script and metadata
        run: npm run check

      - name: Minify release artifact
        if: matrix.artifact == 'minified'
        run: node scripts/minify.mjs --out dist/nodeseek-max.user.js

      - name: Complete browser regression
        env:
          NSMAX_FONT_DIR: ${{ github.workspace }}/.fonts/package/files
          NSMAX_SCRIPT_PATH: ${{ matrix.artifact == 'minified' && format('{0}/dist/nodeseek-max.user.js', github.workspace) || '' }}
        run: npm test

  # 保留统一的 test 检查：源码和安装包都通过后，CI 才成功并触发发布。
  test:
    if: always()
    needs: browser-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Require both artifacts to pass
        env:
          RESULT: ${{ needs.browser-tests.result }}
        run: test "$RESULT" = success
