name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch pinned fonts for the font cache test
        run: |
          mkdir -p .fonts && cd .fonts
          npm pack @fontsource-variable/inter@5.3.0 @fontsource-variable/jetbrains-mono@5.3.0 --silent
          for archive in *.tgz; do tar -xzf "$archive" --wildcards 'package/files/*-latin-wght-normal.woff2'; done
          ls -la package/files

      - name: Check script and metadata
        run: npm run check

      - name: Smoke tests
        env:
          NSMAX_FONT_DIR: ${{ github.workspace }}/.fonts/package/files
        run: npm test
