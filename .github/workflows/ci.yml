name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch pinned fonts for the font cache test
        run: |
          mkdir -p .fonts && cd .fonts
          npm pack @fontsource-variable/inter@5.3.0 @fontsource-variable/jetbrains-mono@5.3.0 --silent
          for archive in *.tgz; do tar -xzf "$archive" --wildcards 'package/files/*-latin-wght-normal.woff2'; done
          ls -la package/files

      - name: Check script and metadata
        run: npm run check

      - name: Smoke tests
        env:
          NSMAX_FONT_DIR: ${{ github.workspace }}/.fonts/package/files
        run: npm test

      # Release 发布的是压缩后的脚本（仓库里保留可读源码）：压缩产物再跑一遍完整测试，确保行为和源码一致
      - name: Minify release artifact
        run: node scripts/minify.mjs --out dist/nodeseek-max.user.js

      - name: Smoke tests (minified artifact)
        env:
          NSMAX_FONT_DIR: ${{ github.workspace }}/.fonts/package/files
          NSMAX_SCRIPT_PATH: ${{ github.workspace }}/dist/nodeseek-max.user.js
        run: npm test
