name: 问题反馈
description: 功能失效、手机体验或界面问题
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先更新到最新正式版，并搜索是否已有相同问题。
        截图和页面链接有助于定位；请去掉 Cookie、令牌、私信及其他个人信息。
  - type: input
    id: version
    attributes:
      label: 脚本版本
      placeholder: 在脚本设置“关于”中查看，例如 1.9.x
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 使用环境
      description: 设备、系统、浏览器、脚本管理器及版本；手机请注明横竖屏。
      placeholder: iPhone，iOS 版本，Safari，Userscripts 版本，竖屏
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 出问题的页面
      description: 可填写公开页面链接或页面类型；私信等私人页面只写类型。
      placeholder: 首页 / 帖子 / 发帖页 / 个人主页 / 设置 / 私信
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现？
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
      description: 分别说明应该发生什么、实际发生了什么；界面问题可在这里附截图。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 相关设置、是否每次出现、其他增强脚本、控制台错误。请先移除敏感信息。
